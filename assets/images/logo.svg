<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="100%" height="100%">
  <defs>
    <linearGradient id="goldLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E3BD68" />
      <stop offset="35%" stop-color="#D8B15E" />
      <stop offset="70%" stop-color="#B88A35" />
      <stop offset="100%" stop-color="#8E651E" />
    </linearGradient>
    <linearGradient id="charcoalLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2D3037" />
      <stop offset="50%" stop-color="#1E2025" />
      <stop offset="100%" stop-color="#101114" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#B88A35" flood-opacity="0.3" />
    </filter>
  </defs>

  <g transform="translate(400, 110)">
    <!-- Architectural towers -->
    <path d="M-28,-80 L-10,-95 L-10,-10 L-28,-5 Z" fill="url(#goldLinear)" />
    <path d="M-8,-95 L8,-105 L8,-10 L-8,-10 Z" fill="url(#charcoalLinear)" />
    <path d="M10,-105 L28,-90 L28,-10 L10,-10 Z" fill="url(#goldLinear)" />

    <!-- House gable outline -->
    <polygon points="0,-60 -75,-15 -65,-5 0,-45 65,-5 75,-15" fill="url(#goldLinear)" />
    <polygon points="0,-45 -65,-5 65,-5" fill="#FFFFFF" fill-opacity="0.95" />

    <!-- 4-Pane Window -->
    <rect x="-10" y="-34" width="8" height="8" fill="url(#goldLinear)" rx="1" />
    <rect x="2" y="-34" width="8" height="8" fill="url(#goldLinear)" rx="1" />
    <rect x="-10" y="-22" width="8" height="8" fill="url(#goldLinear)" rx="1" />
    <rect x="2" y="-22" width="8" height="8" fill="url(#goldLinear)" rx="1" />

    <!-- 3D V Monogram -->
    <!-- Left Wing (Charcoal Black) -->
    <path d="M-130,-70 L-85,-70 L-20,40 L-45,45 Z" fill="url(#charcoalLinear)" />
    <path d="M-130,-70 L-145,-60 L-130,-45 L-95,-45 Z" fill="#22252A" />

    <!-- Right Wing Checkmark (Metallic Gold) -->
    <path d="M-45,45 L-20,40 L95,-35 L125,-45 L-15,65 Z" fill="url(#goldLinear)" filter="url(#goldGlow)" />
    
    <!-- Dynamic Gold Swoosh -->
    <path d="M-105,-15 Q-135,30 -60,52 Q20,68 180,-30 Q80,10 -30,42 Q-95,30 -105,-15 Z" fill="url(#goldLinear)" opacity="0.9" />
  </g>

  <!-- Typography: VISTAHOMZ -->
  <g transform="translate(400, 260)" text-anchor="middle">
    <text font-family="'Cinzel', 'Playfair Display', serif" font-weight="700" font-size="58" letter-spacing="4">
      <tspan fill="#17191D">VISTA</tspan>
      <tspan fill="url(#goldLinear)">HOMZ</tspan>
    </text>

    <!-- Arch over the A in VISTA -->
    <path d="M-62,2 Q-46,-12 -30,2" fill="none" stroke="url(#goldLinear)" stroke-width="3" stroke-linecap="round" />

    <!-- Subtitle: DREAM • INVEST • LIVE -->
    <g transform="translate(0, 42)">
      <!-- Left hairline rule -->
      <line x1="-280" y1="-8" x2="-140" y2="-8" stroke="url(#goldLinear)" stroke-width="1.5" stroke-linecap="round" />
      <circle cx="-135" cy="-8" r="2" fill="url(#goldLinear)" />

      <!-- Subtitle Text -->
      <text font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="14" letter-spacing="8" fill="#17191D" text-anchor="middle" y="-3">
        DREAM  <tspan fill="url(#goldLinear)">•</tspan>  INVEST  <tspan fill="url(#goldLinear)">•</tspan>  LIVE
      </text>

      <!-- Right hairline rule -->
      <circle cx="135" cy="-8" r="2" fill="url(#goldLinear)" />
      <line x1="140" y1="-8" x2="280" y2="-8" stroke="url(#goldLinear)" stroke-width="1.5" stroke-linecap="round" />
    </g>
  </g>
</svg>